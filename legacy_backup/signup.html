<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshFind - Sign Up</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="images/freshfindlogo.jpeg">

    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

    <section class="signup-page">

        <div class="signup-container">

            <!-- Left Side -->

            <div class="signup-left">

                <div class="logo">
                    FreshFind
                </div>

                <div class="left-content">

                    <span class="welcome-tag">
                        <i class="fa-mosaic fa-solid fa-leaf"></i>
                        Join FreshFind
                    </span>

                    <h1>
                        Fresh All Along
                    </h1>

                    <p>
                        Create your FreshFind account and start
                        exploring local farmers markets and fresh
                        seasonal produce.
                    </p>

                </div>

            </div>


            <!-- Right Side -->

            <div class="signup-right">

                <div class="signup-box">

                    <h2>
                        Create Account
                    </h2>

                    <p class="signup-text">
                        Create your FreshFind account
                    </p>


                    <form onsubmit="signupUser(event)">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >


                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >


                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >


                        <label>
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >


                        <label class="terms">

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            <span>
                                I agree to the Terms & Conditions
                            </span>

                        </label>


                        <button type="submit">
                            Create Account
                        </button>

                        <p id="signupMessage"></p>

                    </form>


                    <div class="divider">
                        <span>OR</span>
                    </div>


                    <p class="login-text">
                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>
                    </p>


                    <a href="index.html" class="back-home">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </section>


    

</body>
</html>

<script src="js/signup.js"></script>
