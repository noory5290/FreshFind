<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshFind - Login</title>

    <link rel="shortcut icon" href="images/freshfindlogo.jpeg" type="image/x-icon">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <section class="login-page">

        <div class="login-container">

            <!-- Left Side -->

            <div class="login-left">

                <div class="logo">
                    FreshFind
                </div>

                <div class="left-content">

                    <span class="welcome-tag">
                        Welcome Back
                    </span>

                    <h1>
                        Fresh All Along
                    </h1>

                    <p>
                        Login to explore fresh farmers markets,
                        seasonal produce and more.
                    </p>

                </div>

            </div>


            <!-- Right Side -->

            <div class="login-right">

                <div class="login-box">

                    <h2>
                        Login
                    </h2>

                    <p class="login-text">
                        Login to your FreshFind account
                    </p>


                    <form onsubmit="loginUser(event)">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >


                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >


                        <div class="login-options">

                            <label class="remember">
                                <input
                                    type="checkbox"
                                    id="remember"
                                >
                                Remember Me
                            </label>

                            <a href="#">
                                Forgot Password?
                            </a>

                        </div>


                        <button type="submit">
                            Login
                        </button>

                        <p id="loginMessage"></p>

                    </form>


                    <div class="divider">
                        <span>OR</span>
                    </div>


                    <p class="signup-text">
                        Don't have an account?
                        <a href="signup.html">
                            Sign Up
                        </a>
                    </p>


                    <a href="index.html" class="back-home">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </section>


    

</body>
</html>

<script src="js/login.js"></script>
